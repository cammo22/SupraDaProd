[package]
name = "supradaprod"
version = "0.0.1"
description = "Tiny 100M-parameter text-to-image studio — draw with words or your voice."
authors = ["cammo22"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "supradaprod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "supradaprod"
version = "2.0.0"
description = "Text-to-image studio on your device — type it or say it. Powered by Supra2-IMG."
authors = ["cammo22"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "supradaprod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "29", default-features = false, features = ["legacy-storage-permission"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

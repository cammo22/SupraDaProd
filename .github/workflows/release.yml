name: Release

# Tag `vX.Y.Z` → builds every platform and publishes a GitHub Release.
# A push to `main` whose package.json version has no tag yet does the same and creates the tag itself:
# bump the version (node scripts/set-version.mjs X.Y.Z), merge, done.
# Run manually (Actions → Release → Run workflow) to get the build artifacts only.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["src-tauri/**", "scripts/**", ".github/workflows/release.yml", "package.json"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a GitHub Release (needs a tag ref)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          BUILD=true; PUBLISH=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
            if [[ "$GITHUB_EVENT_NAME" == "push" || "$PUBLISH_INPUT" == "true" ]]; then PUBLISH=true; fi
          else
            V=$(node -p "require('./package.json').version")
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              # main push: release only when this version has not been tagged yet
              if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then BUILD=false; else PUBLISH=true; fi
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $V build=$BUILD publish=$PUBLISH"

  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      # NSIS installer (per-user, IT/EN) + MSI, and the bare exe for the portable build.
      - run: npx tauri build
      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) "out/SupraDaProd_${v}_windows_x64-setup.exe"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1) "out/SupraDaProd_${v}_windows_x64.msi"
          # The exe name contains "portable" → the app keeps every file next to itself.
          Copy-Item src-tauri/target/release/supradaprod.exe "out/SupraDaProd_${v}_windows_x64_portable.exe"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, label: arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, label: x64 } # cross-compiled: the Intel runner images are retired
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npx tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Collect
        run: |
          mkdir out
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg "out/SupraDaProd_${{ needs.version.outputs.version }}_macos_${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  linux:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npx tauri build --bundles appimage,deb
      - name: Collect
        run: |
          mkdir out
          V=${{ needs.version.outputs.version }}
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/SupraDaProd_${V}_linux_x64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "out/SupraDaProd_${V}_linux_x64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)}"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK: $NDK"
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npx tauri android init --ci
      - run: node scripts/patch-android.mjs
      - run: npx tauri android build --apk --target aarch64 --target armv7 --ci

      # Signing: a stable key from repository secrets makes in-place updates work.
      # Without secrets a throw-away key is generated (installable, but each build needs an uninstall first).
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          V=${{ needs.version.outputs.version }}
          if [[ -n "${KS_B64:-}" ]]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ALIAS="$KS_ALIAS"; SPASS="$KS_PASS"; KPASS="${KEY_PASS:-$KS_PASS}"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets — signing with a temporary key (see README → Android signing)."
            ALIAS=supradaprod; SPASS=$(openssl rand -hex 16); KPASS=$SPASS
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SPASS" -keypass "$KPASS" -dname "CN=SupraDaProd, O=DaProd, C=IT"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "signing $APK"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" --key-pass "pass:$KPASS" --out "out/SupraDaProd_${V}_android.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/SupraDaProd_${V}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, windows, macos, linux, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Stable download names + checksums
        run: |
          cd dist
          V=${{ needs.version.outputs.version }}
          # Unversioned copies → https://github.com/<repo>/releases/latest/download/<name> never changes.
          cp "SupraDaProd_${V}_windows_x64-setup.exe"    SupraDaProd-windows-setup.exe
          cp "SupraDaProd_${V}_windows_x64_portable.exe" SupraDaProd-windows-portable.exe
          cp "SupraDaProd_${V}_android.apk"              SupraDaProd-android.apk
          cp "SupraDaProd_${V}_macos_arm64.dmg"          SupraDaProd-macos-arm64.dmg
          cp "SupraDaProd_${V}_macos_x64.dmg"            SupraDaProd-macos-x64.dmg
          cp "SupraDaProd_${V}_linux_x64.AppImage"       SupraDaProd-linux.AppImage
          sha256sum * > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            | --- | --- |
            | 🪟 Windows installer (per-user, IT/EN) | `SupraDaProd-windows-setup.exe` (or `.msi`) |
            | 🪟 Windows **portable** (single exe, leaves no trace) | `SupraDaProd-windows-portable.exe` |
            | 🤖 Android 8+ | `SupraDaProd-android.apk` |
            | 🍎 macOS | `SupraDaProd-macos-arm64.dmg` · `SupraDaProd-macos-x64.dmg` |
            | 🐧 Linux | `SupraDaProd-linux.AppImage` · `.deb` |

            The model (~1 GB) is downloaded once on first use and stored on the device — after that everything works offline.
